<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BioLife Chatbot - Hybrid Guided Flow + NLU Prototype</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
  background: #f0f2f5;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

.chatbot-wrapper {
  width: 420px;
  max-width: 100%;
  height: 700px;
  max-height: 90vh;
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.15), 0 2px 8px rgba(0,0,0,0.08);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

.chat-header {
  background: linear-gradient(135deg, #f47920 0%, #e85d04 50%, #dc2626 100%);
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.chat-header h1 {
  color: #fff;
  font-size: 22px;
  font-weight: 700;
  font-style: italic;
  letter-spacing: -0.3px;
}

.header-actions { display: flex; gap: 12px; align-items: center; }

.header-btn {
  background: none; border: none; color: #fff; font-size: 18px;
  cursor: pointer; opacity: 0.9; transition: opacity 0.2s;
  width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
}
.header-btn:hover { opacity: 1; }

.header-accent {
  height: 3px;
  background: linear-gradient(90deg, #f47920, #fbbf24, #f47920);
  flex-shrink: 0;
}

.chat-messages {
  flex: 1; overflow-y: auto; padding: 16px;
  display: flex; flex-direction: column; gap: 12px;
  scroll-behavior: smooth; background: #fafafa;
}
.chat-messages::-webkit-scrollbar { width: 6px; }
.chat-messages::-webkit-scrollbar-track { background: transparent; }
.chat-messages::-webkit-scrollbar-thumb { background: #c5c5c5; border-radius: 3px; }

.message-row {
  display: flex; gap: 8px; align-items: flex-start;
  max-width: 95%; animation: fadeInUp 0.3s ease;
}
.message-row.bot { align-self: flex-start; }
.message-row.user { align-self: flex-end; flex-direction: row-reverse; }

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.bot-avatar { width: 32px; height: 32px; flex-shrink: 0; margin-top: 2px; }
.bot-avatar svg { width: 32px; height: 32px; }

.message-bubble {
  padding: 12px 16px; border-radius: 16px;
  font-size: 14px; line-height: 1.5; max-width: 100%; word-wrap: break-word;
}
.message-row.bot .message-bubble { background: #f3f4f6; color: #1f2937; border-top-left-radius: 4px; }
.message-row.user .message-bubble { background: #e8f4fd; color: #1f2937; border-top-right-radius: 4px; }
.message-bubble a { color: #2563eb; text-decoration: underline; }

.signup-cta {
  display: flex; align-items: center; gap: 10px; background: #fff;
  border: 1.5px solid #e5e7eb; border-radius: 12px; padding: 10px 16px;
  cursor: pointer; transition: box-shadow 0.2s, border-color 0.2s; max-width: 260px;
}
.signup-cta:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-color: #f47920; }
.signup-cta .cta-text { font-weight: 700; font-size: 15px; color: #1f2937; }
.signup-cta .cta-arrow { color: #f47920; font-size: 18px; margin-left: auto; }

/* CHIPS / BUTTONS - 2 per row, equal size */
.chips-container {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; padding: 4px 0; animation: fadeInUp 0.3s ease;
}
.chip-btn {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 12px 10px; background: #fff; border: 1.5px solid #e0e0e0;
  border-radius: 20px; font-size: 13px; color: #2563eb; font-weight: 500;
  cursor: pointer; transition: all 0.2s; text-align: center;
  line-height: 1.3; min-height: 46px; word-break: break-word;
  box-sizing: border-box; width: 100%;
}
.chip-btn:hover { background: #f0f4ff; border-color: #2563eb; box-shadow: 0 2px 6px rgba(37,99,235,0.12); }
.chip-btn:active { transform: scale(0.97); }
.chip-btn .chip-icon { font-size: 15px; flex-shrink: 0; }
.chip-btn.l1 { padding: 12px 10px; font-size: 13.5px; }

.language-chips { grid-template-columns: 1fr 1fr; }
.language-chips .chip-btn { justify-content: center; font-size: 15px; font-weight: 600; }
.donor-type-chips { grid-template-columns: 1fr 1fr; }
.donor-type-chips .chip-btn { text-align: center; justify-content: center; line-height: 1.3; }

.typing-indicator { display: flex; gap: 4px; padding: 12px 16px; align-items: center; }
.typing-indicator .dot {
  width: 8px; height: 8px; background: #9ca3af; border-radius: 50%;
  animation: typingBounce 1.2s infinite;
}
.typing-indicator .dot:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator .dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-6px); opacity: 1; }
}

.chat-input-area {
  padding: 12px 16px; border-top: 1px solid #e5e7eb;
  display: flex; align-items: center; gap: 10px; background: #fff; flex-shrink: 0;
}
.chat-input {
  flex: 1; border: 1.5px solid #e0e0e0; border-radius: 24px;
  padding: 12px 18px; font-size: 14px; outline: none;
  transition: border-color 0.2s; background: #fafafa;
}
.chat-input:focus { border-color: #f47920; background: #fff; }
.chat-input::placeholder { color: #9ca3af; }

.send-btn {
  width: 42px; height: 42px; background: #f47920; border: none;
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: background 0.2s, transform 0.2s; flex-shrink: 0;
}
.send-btn:hover { background: #e86b10; }
.send-btn:active { transform: scale(0.95); }
.send-btn svg { width: 18px; height: 18px; }

.restart-bar { padding: 8px 16px; text-align: center; flex-shrink: 0; background: #fff; }
.restart-btn {
  background: none; border: 1px dashed #d1d5db; border-radius: 16px;
  padding: 6px 16px; font-size: 12px; color: #6b7280; cursor: pointer; transition: all 0.2s;
}
.restart-btn:hover { border-color: #f47920; color: #f47920; background: #fff7ed; }

.disclaimer-text { font-size: 12.5px; color: #6b7280; line-height: 1.5; }
.disclaimer-text a { color: #f47920; text-decoration: none; font-weight: 500; }

.nlu-badge {
  display: inline-flex; align-items: center; gap: 4px;
  background: linear-gradient(135deg, #fef3c7, #fde68a); border: 1px solid #fbbf24;
  border-radius: 8px; padding: 3px 10px; font-size: 11px; color: #92400e;
  font-weight: 600; margin-bottom: 6px;
}

.nlu-opening { font-size: 13.5px; color: #1f2937; line-height: 1.5; margin-bottom: 8px; }
.nlu-bullet-list { list-style: none; padding: 0; margin: 8px 0; }
.nlu-bullet-list li { padding: 6px 0 6px 18px; position: relative; font-size: 13px; color: #374151; line-height: 1.55; }
.nlu-bullet-list li::before { content: '\2022'; color: #f47920; font-weight: 700; font-size: 16px; position: absolute; left: 2px; top: 5px; }
.nlu-closing { font-size: 13px; color: #6b7280; line-height: 1.5; margin-top: 8px; font-style: italic; }

@media (max-width: 480px) {
  .chatbot-wrapper { width: 100%; height: 100vh; max-height: 100vh; border-radius: 0; }
  body { padding: 0; }
}
</style>
</head>
<body>

<div class="chatbot-wrapper">
  <div class="chat-header">
    <h1>Hey There!</h1>
    <div class="header-actions">
      <button class="header-btn" title="Menu" onclick="showMenu()">&#8942;</button>
      <button class="header-btn" title="Minimize">&#8722;</button>
      <button class="header-btn" title="Close">&#10005;</button>
    </div>
  </div>
  <div class="header-accent"></div>
  <div class="chat-messages" id="chatMessages"></div>
  <div class="restart-bar">
    <button class="restart-btn" onclick="restartChat()">&#8635; Restart Conversation</button>
  </div>
  <div class="chat-input-area">
    <input type="text" class="chat-input" id="chatInput" placeholder="Type a message"
           autocomplete="off" onkeydown="if(event.key==='Enter')sendUserMessage()">
    <button class="send-btn" id="sendBtn" onclick="sendUserMessage()">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
</div>

      "During your visit: <strong>SSN verification, health history review, vitals check</strong>, then your donation.",
      "The whole process takes about <strong>2 hours</strong> for first-time donors."
    ],
    closing: "Check the Health and Nutrition page on the BioLife website for more preparation tips. We look forward to seeing you!",
    includedIntents: ["FirstTimeGuide","FirstVisitCheck","AppointmentEssentials","PrepForAppointment","EatAndHydrate","AppointmentExpectations"],
    followUps: ["VerifySsnAndName","AcceptableIdAndProof","ScheduleOnline","VerifyEligibility"]
  }
};

// ============================================================
// ENGINE
// ============================================================
function findL2ByKey(l2Key) {
  for (const l1Key of Object.keys(L1_CATEGORIES)) {
    const l1 = L1_CATEGORIES[l1Key];
    if (l1.l2[l2Key]) {
      return { ...l1.l2[l2Key], l1Key, l2Key, response: INTENT_RESPONSES[l2Key] ? INTENT_RESPONSES[l2Key].response : "" };
    }
  }
  return null;
}

const chatMessages = document.getElementById('chatMessages');
const chatInput = document.getElementById('chatInput');

function createAvatarHTML() {
  return '<div class="bot-avatar"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="none" stroke="#f47920" stroke-width="2.5" opacity="0.3"/><circle cx="20" cy="20" r="13" fill="none" stroke="#f47920" stroke-width="2.5" opacity="0.5"/><circle cx="20" cy="20" r="8" fill="none" stroke="#f47920" stroke-width="2.5" opacity="0.8"/><circle cx="20" cy="20" r="3" fill="#f47920"/></svg></div>';
}

function addBotMessage(html) {
  var row = document.createElement('div');
  row.className = 'message-row bot';
  row.innerHTML = createAvatarHTML() + '<div class="message-bubble">' + html + '</div>';
  chatMessages.appendChild(row);
  scrollToBottom();
}

function addUserMessage(text) {
  var row = document.createElement('div');
  row.className = 'message-row user';
  row.innerHTML = '<div class="message-bubble">' + escapeHTML(text) + '</div>';
  chatMessages.appendChild(row);
  scrollToBottom();
}

function showTypingThen(callback, delay) {
  delay = delay || 800;
  var row = document.createElement('div');
  row.className = 'message-row bot';
  row.innerHTML = createAvatarHTML() + '<div class="message-bubble"><div class="typing-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>';
  chatMessages.appendChild(row);
  scrollToBottom();
  setTimeout(function() {
    row.remove();
    callback();
    scrollToBottom();
  }, delay);
}

function showChips(chips, containerClass) {
  var container = document.createElement('div');
  container.className = 'chips-container ' + (containerClass || '');
  chips.forEach(function(chip) {
    var btn = document.createElement('button');
    btn.className = 'chip-btn ' + (chip.className || '');
    btn.innerHTML = (chip.icon ? '<span class="chip-icon">' + chip.icon + '</span>' : '') + chip.label;
    btn.onclick = function() {
      disableChips(container);
      chip.action();
    };
    container.appendChild(btn);
  });
  chatMessages.appendChild(container);
  scrollToBottom();
}

function disableChips(container) {
  var btns = container.querySelectorAll('.chip-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].disabled = true;
    btns[i].style.opacity = '0.5';
    btns[i].style.cursor = 'default';
    btns[i].onclick = null;
  }
}

function scrollToBottom() {
  requestAnimationFrame(function() { chatMessages.scrollTop = chatMessages.scrollHeight; });
}

function escapeHTML(str) {
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function escapeRegex(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function keywordMatches(text, keyword) {
  var normalizedKeyword = keyword.toLowerCase().trim();
  if (!normalizedKeyword) return false;
  var pattern = escapeRegex(normalizedKeyword).replace(/\s+/g, '\\s+');
  var regex = new RegExp('\\b' + pattern + '\\b', 'i');
  return regex.test(text);
}

function matchIntent(userText) {
  var lower = userText.toLowerCase().trim();
  var bestMatch = null;
  var bestScore = 0;
  var bestPriority = -1;
  var categoryPriority = {
    "manage_appointment": 2,
    "appointment_scheduling": 1
  };
  var keys = Object.keys(NLU_CATEGORIES);
  for (var i = 0; i < keys.length; i++) {
    var key = keys[i];
    var cat = NLU_CATEGORIES[key];
    var priority = categoryPriority[key] || 0;
    var score = 0;
    for (var j = 0; j < cat.keywords.length; j++) {
      if (keywordMatches(lower, cat.keywords[j])) {
        score += cat.keywords[j].split(' ').length;
      }
    }
    if (score > bestScore || (score === bestScore && score > 0 && priority > bestPriority)) {
      bestScore = score;
      bestPriority = priority;
      bestMatch = { categoryKey: key, category: cat, score: score };
    }
  }
  return bestScore >= 1 ? bestMatch : null;
}

function resolveFollowUpChips(followUpKeys) {
  var chips = [];
  for (var i = 0; i < followUpKeys.length; i++) {
    var fuKey = followUpKeys[i];
    var l2 = findL2ByKey(fuKey);
    if (l2) {
      (function(k) { chips.push({ label: l2.label, icon: l2.icon || "", action: function() { handleL2Click(k); } }); })(fuKey);
    } else {
      var ir = INTENT_RESPONSES[fuKey];
      if (ir) {
        (function(k) { chips.push({ label: ir.label, icon: "", action: function() { handleIntentClick(k); } }); })(fuKey);
      }
    }
  }
  chips.push({ label: "Main Menu", icon: "\ud83c\udfe0", action: function() { showMainMenu(); } });
  return chips;
}

// ============================================================
// CONVERSATION FLOW
// ============================================================
function startChat() {
  chatMessages.innerHTML = '';
  showTypingThen(function() {
    addBotMessage('<span class="disclaimer-text">Welcome to BioLife\'s chatbot. This chatbot uses AI to assist with general inquiries. Interactions may be recorded and used to improve our services. This chatbot is not intended for adverse reporting. To learn more, please review our <a href="#">Privacy Notice</a> on the BioLife website.</span>');
    showTypingThen(function() {
      addBotMessage("Please select your preferred language below:");
      showChips([
        { label: "English", icon: "", action: function() { onLanguageSelected("English"); } },
        { label: "Espa\u00f1ol", icon: "", action: function() { onLanguageSelected("Espa\u00f1ol"); } }
      ], 'language-chips');
    }, 600);
  }, 500);
}

function onLanguageSelected(lang) {
  addUserMessage(lang);
  showTypingThen(function() {
    addBotMessage("Please tell us about you:");
    showChips([
      { label: "I'm considering becoming a donor", action: function() { onDonorType("I'm considering becoming a donor"); } },
      { label: "I actively donate with BioLife today", action: function() { onDonorType("I actively donate with BioLife today"); } },
      { label: "I have donated in the past", action: function() { onDonorType("I have donated in the past"); } },
      { label: "Other", action: function() { onDonorType("Other"); } }
    ], 'donor-type-chips');
  }, 600);
}

function onDonorType(type) {
  addUserMessage(type);
  if (type.indexOf("considering") !== -1) {
    showTypingThen(function() {
      var ctaRow = document.createElement('div');
      ctaRow.className = 'message-row bot';
      ctaRow.innerHTML = createAvatarHTML() + '<div class="signup-cta" onclick="handleL2Click(\'ScheduleOnline\')"><span class="cta-text">Sign Up Today</span><span class="cta-arrow">\u2192</span></div>';
      chatMessages.appendChild(ctaRow);
      showMainMenu();
    }, 500);
  } else {
    showMainMenu();
  }
}

function showMainMenu() {
  showTypingThen(function() {
    addBotMessage("How can I assist you?");
    addBotMessage("Please select an option below to continue, or type your question in the box below.");
    var chips = [];
    var keys = Object.keys(L1_CATEGORIES);
    for (var i = 0; i < keys.length; i++) {
      (function(key) {
        var cat = L1_CATEGORIES[key];
        chips.push({ label: cat.label, icon: cat.icon, className: 'l1', action: function() { handleL1Click(key); } });
      })(keys[i]);
    }
    showChips(chips);
  }, 600);
}

function handleL1Click(l1Key) {
  var l1 = L1_CATEGORIES[l1Key];
  addUserMessage(l1.label);
  showTypingThen(function() {
    addBotMessage(l1.icon + ' <strong>' + l1.label + '</strong> \u2014 Great! Here are some topics I can help with:');
    var chips = [];
    var l2Keys = Object.keys(l1.l2);
    for (var i = 0; i < l2Keys.length; i++) {
      (function(l2Key) {
        var l2 = l1.l2[l2Key];
        chips.push({ label: l2.label, icon: l2.icon, action: function() { handleL2Click(l2Key); } });
      })(l2Keys[i]);
    }
    showChips(chips);
  }, 600);
}

function handleL2Click(l2Key) {
  var l2Data = findL2ByKey(l2Key);
  if (!l2Data) {
    handleIntentClick(l2Key);
    return;
  }
  addUserMessage(l2Data.label);
  showTypingThen(function() {
    addBotMessage(l2Data.response);
    if (l2Data.followUps && l2Data.followUps.length > 0) {
      showTypingThen(function() {
        addBotMessage("Would you like help with anything else?");
        showChips(resolveFollowUpChips(l2Data.followUps));
      }, 400);
    }
  }, 700);
}

function handleIntentClick(intentKey) {
  var intentData = INTENT_RESPONSES[intentKey];
  if (!intentData) return;
  addUserMessage(intentData.label);
  showTypingThen(function() {
    addBotMessage(intentData.response);
    showTypingThen(function() {
      addBotMessage("Would you like help with anything else?");
      showChips([{ label: "Main Menu", icon: "\ud83c\udfe0", action: function() { showMainMenu(); } }]);
    }, 400);
  }, 700);
}

function sendUserMessage() {
  var text = chatInput.value.trim();
  if (!text) return;
  chatInput.value = '';
  addUserMessage(text);
  var match = matchIntent(text);
  showTypingThen(function() {
    if (match) {
      var cat = match.category;
      var html = '<div class="nlu-badge">\ud83e\udd16 Detected: ' + cat.label + '</div>';
      html += '<p class="nlu-opening">' + cat.opening + '</p>';
      html += '<ul class="nlu-bullet-list">';
      for (var i = 0; i < cat.bullets.length; i++) {
        html += '<li>' + cat.bullets[i] + '</li>';
      }
      html += '</ul>';
      html += '<p class="nlu-closing">' + cat.closing + '</p>';
      addBotMessage(html);
      showTypingThen(function() {
        showChips(resolveFollowUpChips(cat.followUps));
      }, 400);
    } else {
      addBotMessage("I'm not sure I understood that. Let me show you the available topics so I can better assist you:");
      showTypingThen(function() {
        var chips = [];
        var keys = Object.keys(L1_CATEGORIES);
        for (var i = 0; i < keys.length; i++) {
          (function(key) {
            var cat2 = L1_CATEGORIES[key];
            chips.push({ label: cat2.label, icon: cat2.icon, className: 'l1', action: function() { handleL1Click(key); } });
          })(keys[i]);
        }
        showChips(chips);
      }, 400);
    }
  }, 800);
}

function restartChat() { startChat(); }

function showMenu() {
  if (confirm('Restart the conversation?')) restartChat();
}

startChat();
</script>
</body>
</html>
